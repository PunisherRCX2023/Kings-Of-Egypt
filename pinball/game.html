<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#040409"><meta name="apple-mobile-web-app-capable" content="yes"><title>Pinball Action V9.08 — 2D-HD</title><style>
:root{color-scheme:dark;--edge:6px;--gap:6px;--top:44px;--bottom:110px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#040409;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{display:flex;align-items:center;justify-content:center}
#app{width:100%;height:100dvh;display:grid;grid-template-rows:var(--top) minmax(0,1fr) var(--bottom);grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;gap:var(--gap);padding:max(4px,env(safe-area-inset-top)) max(var(--edge),env(safe-area-inset-right)) max(5px,env(safe-area-inset-bottom)) max(var(--edge),env(safe-area-inset-left));overflow:hidden}
#service-controls{grid-row:1;display:grid;grid-template-columns:1.15fr 1fr 1fr .95fr;width:min(100%,540px);height:100%;gap:7px;align-items:stretch}
#display{grid-row:2;height:100%;max-height:100%;max-width:100%;aspect-ratio:224/256;width:min(calc((100dvh - var(--top) - var(--bottom) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*224/256),calc(100vw - 12px),540px);height:auto;overflow:hidden;box-shadow:0 0 0 2px #242028;outline:1px solid #77707b;background:#000;align-self:center}
#game{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#controls{grid-row:3;width:min(100%,540px);height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.86fr) minmax(0,1fr);grid-template-rows:1fr 1fr;gap:6px 8px;align-items:stretch}
button{min-width:0;min-height:0;font-family:system-ui,sans-serif;font-weight:900;font-size:clamp(12px,3.6vw,17px);letter-spacing:.3px;border:2px solid #aa9d74;border-radius:10px;color:#fcf3db;background:linear-gradient(160deg,#48404a,#1b1924);box-shadow:inset 0 1px 0 #9a8496,0 3px 0 #0a0812;touch-action:none;cursor:pointer;padding:0 3px}
#service-controls button{font-size:clamp(12px,3.6vw,16px);border-radius:8px;border-color:#8d8681;background:linear-gradient(160deg,#47404d,#292632)}
#service-controls #start{color:#fffbe7;border-color:#ffd560;background:linear-gradient(160deg,#2d7b4f,#16432b)}
#service-controls #sound{font-size:clamp(8px,2.5vw,11px);border-color:#7cc1b5;color:#e6fffb;background:linear-gradient(160deg,#235358,#152b34);overflow:hidden}
#service-controls #sound[aria-pressed="false"]{border-color:#777;color:#aaa;background:#27272a}
#left{grid-column:1;grid-row:1/3}
#right{grid-column:3;grid-row:1/3}
#left,#right{font-size:clamp(17px,5vw,25px);border-color:#ebc36a;background:linear-gradient(160deg,#675137,#30231d);box-shadow:inset 0 1px 0 #ffe0a0,0 3px 0 #17100c}
#launch{grid-column:2;grid-row:1;border-color:#a4ddaa;background:linear-gradient(160deg,#32794d,#173c28);font-size:clamp(11px,3.3vw,15px)}
#shake{grid-column:2;grid-row:2;border-color:#bea7d8;background:linear-gradient(160deg,#534263,#29213a);font-size:clamp(11px,3.3vw,15px)}
button.down,button:active{transform:translateY(2px);box-shadow:inset 0 2px 5px #000;filter:brightness(1.25)}
@media(orientation:landscape){:root{--top:34px;--bottom:76px;--gap:4px}#app{padding:3px max(8px,env(safe-area-inset-right)) 4px max(8px,env(safe-area-inset-left))}#service-controls{width:min(100%,480px)}#controls{width:min(100%,480px)}#display{width:min(calc((100dvh - 132px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*224/256),540px,90vw)}#service-controls button{font-size:12px}#left,#right{font-size:19px}}
@media(max-height:330px){:root{--top:30px;--bottom:62px;--gap:3px}#display{width:min(calc((100dvh - 108px)*224/256),540px,90vw)}}
#app:after{content:"V9.08 — " attr(data-mode);position:fixed;right:max(8px,env(safe-area-inset-right));bottom:2px;font-size:9px;color:#a69eae;pointer-events:none;line-height:1}

/* V8.83 — PixiJS: use the entire central grid track on portrait phones. Canvas backing resolution remains 224x256. */
@media(orientation:portrait){
 #app{--gap:4px;align-items:stretch}
 #display{width:min(100%,540px);height:100%;min-height:0;max-height:100%;aspect-ratio:auto;align-self:stretch;justify-self:center}
 #game{width:100%;height:100%;object-fit:fill}
}
/* Explicit portrait track sizing; absolute canvas cannot impose its intrinsic aspect ratio on the grid. */
@media (max-aspect-ratio:1/1){
 #app{height:100%;min-height:0;align-items:stretch;--gap:4px}
 #display{position:relative;width:min(100%,540px);height:auto;min-height:0;max-height:none;aspect-ratio:auto;align-self:stretch}
 #game{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:fill}
}
/* HD is a separate presentation mode; classic rendering and game logic stay intact. */
#service-controls{grid-template-columns:1.12fr .85fr .85fr 1fr .8fr;gap:5px}
#service-controls #graphics{font-size:clamp(9px,2.3vw,12px);color:#c5fffa;border-color:#4adccb;background:linear-gradient(145deg,#185962,#14263c);text-shadow:0 0 7px #38bbb9}
#service-controls #graphics[aria-pressed="false"]{color:#f6dfae;border-color:#9c8f73;background:#34303d;text-shadow:none}
#display.hd{outline:1px solid #79a7bc;box-shadow:0 0 12px #357fa755,0 0 0 2px #263441}
#display.hd #game{image-rendering:auto}
/* Gentle arcade CRT: static optical layers only, never touch the ROM or HD pixels. */
#display.crt{position:relative;border-radius:1.3% / .9%;outline:1px solid #534d4b;box-shadow:0 0 0 2px #242028,0 0 9px #a6c4a71f}
#display.crt #game{filter:contrast(1.025) saturate(.975) brightness(1.035)}
#display.crt::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,0,0,.075) 2px,rgba(0,0,0,.075) 3px),repeating-linear-gradient(90deg,rgba(255,70,70,.018) 0px,rgba(80,255,110,.012) 1px,rgba(75,120,255,.018) 2px,transparent 3px),radial-gradient(ellipse at 50% 48%,transparent 64%,rgba(0,0,0,.11) 100%);box-shadow:inset 0 0 10px rgba(0,0,0,.06)}
/* Test mode uses the genuine Z80 startup diagnostics in a separate RAM session. */
#diagnostic-head[hidden],#diagnostic-controls[hidden]{display:none!important}
#diagnostic-head{grid-row:1;display:flex;align-items:center;justify-content:center;width:min(100%,540px);height:100%;font-size:13px;color:#d7f7ee;text-align:center;font-weight:800}
#diagnostic-controls{grid-row:3;display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,540px);height:100%}
#diagnostic-next{border-color:#96dbab;background:#235d3b}
#diagnostic-next:disabled{opacity:.55}
#diagnostic-exit{border-color:#e4b18e;background:#57312e}
#app.diagnostic #service-controls,#app.diagnostic #controls{display:none}
/* V8.83 — crisp tactile controls in HD mode only, with original geometry. */
#app:has(#display.hd) #controls button{border-radius:13px;border-width:1px;box-shadow:inset 0 1px 0 #fff2,0 3px 0 #070b13}
#app:has(#display.hd) #left,#app:has(#display.hd) #right{background:linear-gradient(150deg,#57412b,#262339);border-color:#d9b978}
#app:has(#display.hd) #controls button.down{transform:translateY(2px);box-shadow:inset 0 1px 6px #0007}
/* Remastered control deck: individually constructed hardware buttons. */
#app:has(#display.hd){background:linear-gradient(90deg,#050810,#152131 5%,#0b121d 15%,#0b121d 85%,#152131 95%,#050810);gap:5px}
#display.hd{outline:1px solid #b0c7da;box-shadow:0 0 0 2px #4c6377,0 0 0 4px #172536,0 0 15px #000a}
#app:has(#display.hd) #controls{padding:3px;border-radius:15px;background:linear-gradient(150deg,#3a4c60,#131e2d 35%,#09101a 70%,#273a50);box-shadow:inset 0 1px 0 #819bb2,0 2px 6px #0008}
#app:has(#display.hd) #controls button{position:relative;border:1px solid #b8c7d5;color:#f6f9fb;letter-spacing:.065em;text-shadow:0 1px 2px #10101b;box-shadow:inset 0 2px 1px #ffffff60,inset 0 -4px 0 #0004,0 3px 0 #070d17}
#app:has(#display.hd) #left,#app:has(#display.hd) #right{background:linear-gradient(160deg,#e1ac55 0%,#976326 22%,#684322 49%,#3e2c26 73%,#af7c3d 100%);border-color:#e9ca8b}
#app:has(#display.hd) #launch{background:linear-gradient(155deg,#82d9ad,#29835b 32%,#15563f 75%,#3d9672)}
#app:has(#display.hd) #shake{background:linear-gradient(155deg,#b09bdb,#675191 32%,#352b55 75%,#7866a1)}
#app:has(#display.hd) #service-controls button{background:linear-gradient(145deg,#597087,#283a4c 34%,#142132 76%,#354f65);border:1px solid #9ab0c2;box-shadow:inset 0 1px 1px #fff5,0 2px 0 #080e16}
#app:has(#display.hd) #service-controls #graphics{background:linear-gradient(#298597,#0c3d50);border-color:#95d9e0;color:#e5ffff}
#app:has(#display.hd) #service-controls #start{background:linear-gradient(#53a67a,#184c34);border-color:#b9edc6}
#app:has(#display.hd) #service-controls #sound[aria-pressed="false"]{background:linear-gradient(#424b56,#252b35);border-color:#6e7b89;color:#bcc4cd}
#app:has(#display.hd) #controls button.down,#app:has(#display.hd) #service-controls button.down{transform:translateY(2px);box-shadow:inset 0 2px 7px #0009,0 1px #060b14}
</style></head>
<body><main id="app">
<div id="service-controls"><button id="coin" aria-label="Inserir ficha">FICHA</button><button id="start" aria-label="P1 — iniciar 1 jogador" title="Iniciar partida para 1 jogador">P1</button><button id="start2" aria-label="P2 — iniciar 2 jogadores" title="Iniciar partida para 2 jogadores">P2</button><button id="sound" aria-label="Som original" aria-pressed="true">🔊 SOM</button><button id="graphics" type="button" aria-label="Alternar entre HD e CRT original suave" aria-pressed="true">HD</button></div>
<div id="display"><canvas id="game" width="224" height="256" aria-label="Mesa do Pinball Action original"></canvas></div>
<div id="controls"><button id="left" aria-label="Flipper esquerdo">ESQ.</button><button id="launch" aria-label="Lançar bola">LANÇAR</button><button id="shake" aria-label="Abanar a mesa">SHAKE</button><button id="right" aria-label="Flipper direito">DIR.</button></div>
<div id="diagnostic-head" role="status" hidden>DIAGNÓSTICO ORIGINAL</div>
<div id="diagnostic-controls" hidden><button id="diagnostic-next" type="button" disabled>P1 · AVANÇAR</button><button id="diagnostic-exit" type="button">SAIR</button></div>
</main>

const lastServiceSource={coin:'',start:'',start2:''};
function activateService(k,source='pointer'){
 if(!entryComplete)return;
 const t=performance.now(), elapsed=t-lastServicePress[k];
 // Ignore compatibility click events after a real touch/pointer, but allow
 // separate fast FICHA taps and real click-only Safari fallback activations.
 if(source==='click' && lastServiceSource[k]!=='click' && elapsed<750)return;
 if(elapsed<130)return;
 lastServicePress[k]=t;
 lastServiceSource[k]=source;
 if(k==='start'||k==='start2')startGameRequest(k);
 else pending[k]=Math.max(pending[k],pulseLength);
 refreshKeys();
 arcadeAudio.boot();
}
// The original ROM keeps its coin credits at 0xc013, confirmed by Z80 RAM traces.
// Pressing 1 JOGADOR from zero credits first drives the genuine coin input,
// waits for the ROM to increment its own credit counter, then drives START1.
// No RAM credits, scores or gameplay state are fabricated by the controller.
let queuedStart=null;
function startGameRequest(k){
 arcadeAudio.gameStart();
 const required=k==='start2'?2:1;
 if(memory[0xc013]>=required){
  pending[k]=Math.max(pending[k],18);
 } else {
  queuedStart={key:k,required,frames:0};
  pending.coin=Math.max(pending.coin,14);
  const button=document.getElementById(k);
  if(button)button.textContent='A INICIAR…';
 }
}
function endStartRequest(){
 if(queuedStart){
  const button=document.getElementById(queuedStart.key);
  if(button)button.textContent=queuedStart.key==='start'?'P1':'P2';
 }
 queuedStart=null;
}
function refreshKeys(){
 let p1=0,system=0;
 for(const k of active){
  if(keys[k])p1|=keys[k];
  if(k==='coin')system|=momentary.coin;
 }
 for(const k of Object.keys(p1Pulse))if(p1Pulse[k]>0)p1|=keys[k];
 for(const k of Object.keys(momentary))if(pending[k]>0)system|=momentary[k];
 cpu.io.p1=p1;cpu.io.system=system;
}
function press(k,yes){
 if(!keys[k]&&!momentary[k])return;
 if(yes){
  if(!active.has(k)){
   if(momentary[k])activateService(k);
   if(p1MinFrames[k])p1Pulse[k]=Math.max(p1Pulse[k],p1MinFrames[k]);
  }
  active.add(k);
  arcadeAudio.boot();
  // Flippers, ball launch and stage changes are now all controlled by genuine ROM commands.
 } else active.delete(k);
 refreshKeys();
}
function finishInputFrame(){
 for(const k in pending){if(pending[k]>0)pending[k]--;}
 for(const k in p1Pulse){if(p1Pulse[k]>0)p1Pulse[k]--;}
 if(queuedStart){
  queuedStart.frames++;
  if(memory[0xc013]>=queuedStart.required){
   pending[queuedStart.key]=Math.max(pending[queuedStart.key],18);
   endStartRequest();
  }else if(queuedStart.frames%50===0){
   // Fresh hardware coin pulse after a low interval, only if still needed.
   pending.coin=Math.max(pending.coin,14);
  }
  if(queuedStart && queuedStart.frames>400)endStartRequest();
 }
 refreshKeys();
}
for(let k of [...Object.keys(keys),...Object.keys(momentary)]){
 let b=document.getElementById(k);
 if(!b)continue;
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch{}press(k,true);b.classList.add('down')});
 for(const end of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(end,e=>{e.preventDefault();press(k,false);b.classList.remove('down')});
 // iOS Safari sometimes suppresses pointerdown or drops pointer capture in local HTML previews.
 // A touch or synthesized click still activates FICHA, START and 2 JOG; the guard above
 // prevents multiple activations from one tap. Keyboard controls remain unchanged.
 if(momentary[k]){
  b.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();activateService(k,'touch');b.classList.add('down')},{passive:false});
  b.addEventListener('click',e=>{e.preventDefault();activateService(k,'click');b.classList.add('down');setTimeout(()=>b.classList.remove('down'),110)});
  b.addEventListener('touchend',()=>{active.delete(k);b.classList.remove('down')},{passive:true});
  b.addEventListener('touchcancel',()=>{active.delete(k);b.classList.remove('down')},{passive:true});
 }else{
  b.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();press(k,true);b.classList.add('down')},{passive:false});
  for(const end of ['touchend','touchcancel'])b.addEventListener(end,()=>{press(k,false);b.classList.remove('down')},{passive:true});
 }
}

const keyboard={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'launch',ArrowDown:'launch',Enter:'start',ArrowUp:'shake',KeyS:'shake',KeyC:'coin',Digit1:'start',Numpad1:'start',Digit2:'start2',Numpad2:'start2'};
window.addEventListener('keydown',e=>{if(!entryComplete)return;let k=keyboard[e.code];if(!k)return;e.preventDefault();if(!e.repeat)press(k,true)});
window.addEventListener('keyup',e=>{let k=keyboard[e.code];if(!k)return;e.preventDefault();press(k,false)});
window.addEventListener('blur',()=>{active.clear();for(const k in pending)pending[k]=0;endStartRequest();refreshKeys()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)arcadeAudio.restore();if(document.hidden){active.clear();for(const k in pending)pending[k]=0;endStartRequest();refreshKeys()}});
let last=performance.now(),acc=0,frames=0;
const trajectoryDebug=!!window.PB_TEST||new URLSearchParams(location.search).has('test');
const ballTrace=[];
function recordBallFrame(){
 if(!trajectoryDebug)return;
 const raw=Array.from(memory.subarray(0xe03c,0xe040));
 ballTrace.push({frame:frames,table:tableLampIdentity(memory),mode:memory[0xc009],scroll:cpu.scroll,raw,ballRegisters:Array.from(memory.subarray(0xc014,0xc027))});
 if(ballTrace.length>600)ballTrace.shift();
}
const MAX_SIMULATION_DEBT=3;
function limitSimulationDebt(debt,delta){return Math.min(MAX_SIMULATION_DEBT,debt+Math.max(0,delta)*60/1000);}
function frame(now){
 let delta=Math.max(0,Math.min(70,now-last));last=now;
 if(document.hidden)acc=0;
 if(entryComplete&&!document.hidden){
  renderStats.displayFrames=(renderStats.displayFrames||0)+1;
  if(delta>25)renderStats.slowDisplayFrames=(renderStats.slowDisplayFrames||0)+1;
 }
 if(!document.hidden&&diagnostic){tickDiagnostic();}
 else if(!document.hidden&&entryComplete){
  const requested=acc+Math.max(0,delta)*60/1000;
  acc=limitSimulationDebt(acc,delta);
  if(requested>acc)renderStats.wallClockDebtDropped=(renderStats.wallClockDebtDropped||0)+(requested-acc);
  let count=0;
  while(acc>=1&&count<2){
   // Our initial state was captured at the end of a real 60 Hz arcade frame.
   for(let i=0;i<6500;i++){if(cpu.halt)break;cpu.step();}
   cpu.nmi();finishInputFrame();acc-=1;count++;frames++;recordBallFrame();
  }
  if(cpu.videoChanged||frames===0){
   const start=performance.now();render();const ms=performance.now()-start;
   renderStats.renderMsMax=Math.max(renderStats.renderMsMax||0,ms);
   renderStats.renderMsTotal=(renderStats.renderMsTotal||0)+ms;
   renderStats.renderSamples=(renderStats.renderSamples||0)+1;
   cpu.videoChanged=false;
  }
 }
 requestAnimationFrame(frame);
}
render();initMainArt();requestAnimationFrame(frame);
 gpu?.init(()=>{if(hdMode){hdBoardDirty=hdFrontDirty=true;render();}},()=>{if(hdMode)render();});
// Entry activates the title command before the game CPU resumes.
// Debug/test API (not visible in production).
if(window.PB_TEST||new URLSearchParams(location.search).has('test')) window.__pbRom={
 paletteScripts:()=>romPaletteScripts.map(o=>({...o})),
 livePalette:()=>({table:tableLampIdentity(memory),pens:[...livePenPlan(boardVariants).pens].sort((a,b)=>a-b),cells:hdArtStats?.livePaletteCells||0,remembered:[...rememberedTablePens].map(([id,pens])=>({id,pens:[...pens].sort((a,b)=>a-b)}))}),
 lamps:()=>({main:isMainPrint(memory),lamps:mainInserts.map(([x,y,base,pen])=>({x,y,pen,color:colorAt(pen),lit:mainLampLit(palette32[pen])}))}),
 state:()=>({pc:cpu.pc,sp:cpu.sp,credits:memory[0xc013],queuedStart:queuedStart?.key||null,score:memory.slice(0xc000,0xc010).join(','),steps:cpu.steps,scroll:cpu.scroll,frames,nmi:cpu.nmiEnable,flipped:cpu.flipped,memChecksum:memory.slice(0xd000,0xe600).reduce((a,b)=>a+b,0)}),
 input:(k,on)=>press(k,!!on),pending:()=>({...pending}),frame:()=>{for(let i=0;i<6500;i++){if(cpu.halt)break;cpu.step();}cpu.nmi();finishInputFrame();frames++;recordBallFrame();render()},
 ballTrace:()=>ballTrace.map(o=>({...o,raw:[...o.raw],ballRegisters:[...o.ballRegisters]})),
 spritePreview:(code,big=false,base=0)=>{const atlas=big?atlases.big:atlases.sp;if(!Number.isInteger(code)||code<0||code>=atlas.count||!Number.isInteger(base)||base<0||base>120||base%8)throw Error('Invalid sprite');const art=getSpriteArt(atlas,code,base,big);const native=document.createElement('canvas');native.width=atlas.w;native.height=atlas.h;const cx=native.getContext('2d');for(let y=0;y<atlas.h;y++)for(let x=0;x<atlas.w;x++){const pen=atlas.pens[code*atlas.w*atlas.h+y*atlas.w+x];if(pen){cx.fillStyle=colorAt(base+pen);cx.fillRect(x,y,1,1)}}return {hd:art.toDataURL(),original:native.toDataURL(),family:hdSpriteFamily(atlas,code,big)}},
 spriteAudit:(code,big=false,base=0)=>{
  const atlas=big?atlases.big:atlases.sp;
  if(!Number.isInteger(code)||code<0||code>=atlas.count||!Number.isInteger(base)||base<0||base>120||base%8)throw Error('Invalid sprite');
  const art=getSpriteArt(atlas,code,base,big),w=atlas.w,h=atlas.h;
  const rgba=art.getContext('2d').getImageData(0,0,w*HD,h*HD).data;
  let nativeCells=0,hdCells=0,missing=0,extra=0,alphaSum=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const native=!!atlas.pens[code*w*h+y*w+x];let a=0;
   for(let j=0;j<HD;j++)for(let i=0;i<HD;i++)a+=rgba[4*((y*HD+j)*(w*HD)+x*HD+i)+3];
   const occupied=a>=128*HD*HD;alphaSum+=a/(255*HD*HD);
   if(native)nativeCells++;if(occupied)hdCells++;
   if(native&&!occupied)missing++;if(!native&&occupied)extra++;
  }
  return {code,big,base,family:hdSpriteFamily(atlas,code,big),nativeCells,hdCells,missing,extra,alphaArea:Math.round(alphaSum*100)/100,
   intentionalAspect:!big&&code===5};
 },
 image:()=>gpu?gpu.image():canvas.toDataURL(),renderer:()=>({mode:hdMode?'2D-HD':'CRT',backend:gpu?.enabled?'PixiJS WebGL':'Canvas2D',status:gpu?.status||'unavailable',art:hdArtStats,atlas:hdAtlasInventory(),performance:{...renderStats,boardVariants:globalBoardVariants.size,simulationDebt:acc},gpuPerformance:gpu?{...gpu.stats}:null}),audio:()=>arcadeAudio.state(),sound:(cmd)=>arcadeAudio.fromRom(cmd),audioDebug:()=>arcadeAudio.debug(),cpu};
})();
